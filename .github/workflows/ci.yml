name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.*']
        exclude:
          # Symfony 7 needs PHP 8.2 or newer.
          - php: '8.1'
            symfony: '7.*'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      # fopost/sdk is not on Packagist yet, so resolve the parent from its
      # repository. Delete this step once the package is published.
      - name: Point Composer at the parent SDK repository
        run: composer config repositories.parent vcs https://github.com/fopost/fopost-php

      - name: Pin the Symfony version under test
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit

      - name: Run PHP_CodeSniffer
        run: ./vendor/bin/phpcs
